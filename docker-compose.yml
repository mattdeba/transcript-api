version: "3.9"

services:
  fastapi_app:
    build: .
    container_name: fastapi_app
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=dockbarge.cloud
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=dockbarge.cloud
    networks:
      - webproxy
    restart: always
    # (Optionnel pour debug sans proxy)
    # ports:
    #   - "8000:8000"

networks:
  webproxy:
    external: true
